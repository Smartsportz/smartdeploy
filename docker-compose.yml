# Host ports are parameterised so a single server can host several stacks and
# so the published ports can be kept on the loopback interface, with the host
# nginx in deploy/nginx/smartdeploy.conf as the only public entry point.
#
# Secrets come from the file referenced by env_file below. It deliberately
# lives OUTSIDE the git clone (../.env) so that the `git reset --hard` in
# scripts/deploy.sh cannot delete it. See .env.example.

x-app-secrets: &app-secrets
  env_file:
    - path: ../.env
      required: false
    - path: .env
      required: false

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - smart_sportz_redis:/data

  backend-init:
    <<: *app-secrets
    build:
      context: ./backend
    command: ["python", "-m", "app.cli", "init-db"]
    restart: "no"
    environment:
      APP_ENV: docker
      APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY must be set in the env file}
      DATABASE_BACKEND: sqlite
      DATABASE_PATH: storage/smartsportz.db
      MIRROR_DATABASE_PATH: storage/smartsportz_mirror.db
      AUDIT_DATABASE_PATH: storage/smartsportz_audit.db
      READ_FROM_MIRROR: "false"
      REDIS_URL: redis://redis:6379/0
      INIT_DB_ON_STARTUP: "false"
      SEED_DB_ON_STARTUP: "false"
      CLEANUP_MEDIA_ON_STARTUP: "false"
      OTP_DELIVERY_MODE: ${OTP_DELIVERY_MODE:-local}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - smart_sportz_storage:/app/storage

  backend:
    <<: *app-secrets
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: docker
      APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY must be set in the env file}
      DATABASE_BACKEND: sqlite
      DATABASE_PATH: storage/smartsportz.db
      MIRROR_DATABASE_PATH: storage/smartsportz_mirror.db
      AUDIT_DATABASE_PATH: storage/smartsportz_audit.db
      REDIS_URL: redis://redis:6379/0
      INIT_DB_ON_STARTUP: "true"
      SEED_DB_ON_STARTUP: "false"
      CLEANUP_MEDIA_ON_STARTUP: "false"
      PUBLIC_CACHE_TTL_SECONDS: "45"
      DASHBOARD_CACHE_TTL_SECONDS: "20"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081}
      WEB_CONCURRENCY: "4"
      OTP_DELIVERY_MODE: ${OTP_DELIVERY_MODE:-local}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-true}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-Smart Sportz}
      SMTP_SENDER_EMAIL: ${SMTP_SENDER_EMAIL:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-brevo}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    depends_on:
      backend-init:
        condition: service_completed_successfully
    volumes:
      - smart_sportz_storage:/app/storage
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      # python:3.11-slim ships neither curl nor wget, so probe with urllib.
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4).status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  worker:
    <<: *app-secrets
    build:
      context: ./backend
    command: ["python", "-m", "app.cli", "worker"]
    restart: unless-stopped
    environment:
      APP_ENV: docker
      APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY must be set in the env file}
      DATABASE_BACKEND: sqlite
      DATABASE_PATH: storage/smartsportz.db
      MIRROR_DATABASE_PATH: storage/smartsportz_mirror.db
      AUDIT_DATABASE_PATH: storage/smartsportz_audit.db
      REDIS_URL: redis://redis:6379/0
      INIT_DB_ON_STARTUP: "false"
      SEED_DB_ON_STARTUP: "false"
      CLEANUP_MEDIA_ON_STARTUP: "false"
    depends_on:
      backend-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - smart_sportz_storage:/app/storage

  celery-worker:
    <<: *app-secrets
    build:
      context: ./backend
    command: ["celery", "-A", "app.services.celery_app.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    restart: unless-stopped
    environment:
      APP_ENV: docker
      APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY must be set in the env file}
      DATABASE_BACKEND: sqlite
      DATABASE_PATH: storage/smartsportz.db
      MIRROR_DATABASE_PATH: storage/smartsportz_mirror.db
      AUDIT_DATABASE_PATH: storage/smartsportz_audit.db
      REDIS_URL: redis://redis:6379/1
      INIT_DB_ON_STARTUP: "false"
      SEED_DB_ON_STARTUP: "false"
      CLEANUP_MEDIA_ON_STARTUP: "false"
    depends_on:
      backend-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - smart_sportz_storage:/app/storage

  celery-beat:
    <<: *app-secrets
    build:
      context: ./backend
    command: ["celery", "-A", "app.services.celery_app.celery_app", "beat", "--loglevel=INFO"]
    restart: unless-stopped
    environment:
      APP_ENV: docker
      APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY must be set in the env file}
      DATABASE_BACKEND: sqlite
      DATABASE_PATH: storage/smartsportz.db
      MIRROR_DATABASE_PATH: storage/smartsportz_mirror.db
      AUDIT_DATABASE_PATH: storage/smartsportz_audit.db
      REDIS_URL: redis://redis:6379/1
      INIT_DB_ON_STARTUP: "false"
      SEED_DB_ON_STARTUP: "false"
      CLEANUP_MEDIA_ON_STARTUP: "false"
    depends_on:
      backend-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - smart_sportz_storage:/app/storage

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BASE_PATH: /
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${FRONTEND_PORT:-8081}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - smart_sportz_prometheus:/prometheus
    depends_on:
      - backend
      - frontend
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?GF_ADMIN_PASSWORD must be set in the env file}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - smart_sportz_grafana:/var/lib/grafana
    depends_on:
      - prometheus
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${GRAFANA_PORT:-3001}:3000"

volumes:
  smart_sportz_storage:
  smart_sportz_redis:
  smart_sportz_prometheus:
  smart_sportz_grafana:
