# form.smartsportz.in - single-page registration form.
#
# Proxies /api/ to the backend container over the compose network, exactly
# like frontend/nginx.conf does. That keeps the page same-origin with the API,
# so ALLOWED_ORIGINS / CORS never enters the picture.

limit_req_zone $binary_remote_addr zone=form_submit_limit:10m rate=6r/m;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  resolver 127.0.0.11 valid=30s ipv6=off;

  # No uploads on this form; keep the body small so it cannot be abused.
  client_max_body_size 64k;
  # nginx answers a throttled request with 503 by default; 429 is the correct
  # status and is what the page's JS renders a "too many submissions" message for.
  limit_req_status 429;
  keepalive_timeout 65;
  proxy_connect_timeout 5s;
  proxy_send_timeout 30s;
  proxy_read_timeout 30s;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # Only the two endpoints this page needs are exposed. Everything else under
  # /api/ is deliberately NOT proxied - this subdomain must not become a second
  # unauthenticated door into the admin API.
  location = /api/v1/form/register {
    limit_req zone=form_submit_limit burst=4 nodelay;
    proxy_pass http://backend:8000/api/v1/form/register;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/v1/form/options {
    proxy_pass http://backend:8000/api/v1/form/options;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Anything else under /api/ is a hard 404. Without this the try_files
  # fallback in `location /` would answer /api/v1/admin/users with the form
  # page and a 200, which is a confusing thing to hand a caller.
  # Exact-match locations above still win over this prefix match.
  location /api/ {
    return 404;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }
}
