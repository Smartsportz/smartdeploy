# SmartSportz - host nginx site config
#
# Serves the app at the apex, https://smartsportz.in, with www redirecting
# to it so there is a single canonical origin (which must match
# ALLOWED_ORIGINS in /opt/smartdeploy/.env).
#
# Installed onto the host by scripts/deploy.sh (step 9), which backs up the
# current config, runs `nginx -t`, and reloads only if the test passes.
#
# The "# managed by Certbot" lines are added by:
#   certbot --nginx -d smartsportz.in -d www.smartsportz.in
# Keep them. deploy.sh refuses to install this file if the live config has
# ssl_certificate and this copy does not, because nginx -t would still pass
# and HTTPS would stop silently.
#
# NOTE ON ROUTING: the frontend container already runs nginx and proxies
# /api/, /api/v1/auth/ (rate limited), /api/v1/live/ws, /api/v1/realtime/ws
# and /metrics to backend:8000 over the compose network. This host-side
# config is a thin edge proxy - do not duplicate those location blocks here,
# or the inner rate limiting and websocket rules stop applying.

map $http_upgrade $smartdeploy_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream smartdeploy_frontend {
    server 127.0.0.1:8081;   # FRONTEND_PORT in /opt/smartdeploy/.env
    keepalive 32;
}

# ---------------------------------------------------------------------------
# www -> apex. One canonical origin keeps CORS and OAuth redirect URIs simple.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name www.smartsportz.in;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://smartsportz.in$request_uri;
    }
}

# ---------------------------------------------------------------------------
# The application.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name smartsportz.in;

    # Matches client_max_body_size in the frontend container's nginx.conf.
    client_max_body_size 25m;

    access_log /var/log/nginx/smartdeploy.access.log;
    error_log  /var/log/nginx/smartdeploy.error.log;

    # Let certbot answer the HTTP-01 challenge before any redirect applies.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        proxy_pass http://smartdeploy_frontend;
        proxy_http_version 1.1;

        # Websocket support for /api/v1/live/ws and /api/v1/realtime/ws.
        # Harmless for plain requests: the map sends "close" when there is
        # no Upgrade header.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $smartdeploy_connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        # Long enough for the live websocket to stay open.
        proxy_read_timeout    1h;

        proxy_buffering off;
    }

    # Edge security headers. Content-Security-Policy is intentionally omitted:
    # set it only after checking what the built SPA actually loads.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}

