# SmartSportz - host nginx site config
#
# This file is installed onto the host by scripts/deploy.sh (step 9), which
# backs up the current config, runs `nginx -t`, and reloads only if the test
# passes - restoring the backup if it does not.
#
# The lines marked "# managed by Certbot" were added by:
#   certbot --nginx -d test.smartsportz.in
# Keep them. deploy.sh refuses to install this file if the live config has
# ssl_certificate and this copy does not, because nginx -t would still pass
# and HTTPS would stop silently. Certbot only rewrites the config at issuance;
# renewals just replace the files under /etc/letsencrypt/live/.
#
# NOTE ON ROUTING: the frontend container already runs nginx and proxies
# /api/, /api/v1/auth/ (rate limited), /api/v1/live/ws and /metrics to
# backend:8000 over the compose network. This host-side config is therefore a
# thin edge proxy - do not duplicate those location blocks here, or the inner
# rate limiting and websocket rules stop applying.

# Named uniquely so this file can coexist with other sites that define their
# own websocket upgrade map.
map $http_upgrade $smartdeploy_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream smartdeploy_frontend {
    server 127.0.0.1:8081;   # FRONTEND_PORT in /opt/smartdeploy/.env
    keepalive 32;
}

server {

    # Must match ALLOWED_ORIGINS in /opt/smartdeploy/.env.
    server_name test.smartsportz.in;

    # Matches client_max_body_size in the frontend container's nginx.conf.
    client_max_body_size 25m;

    access_log /var/log/nginx/smartdeploy.access.log;
    error_log  /var/log/nginx/smartdeploy.error.log;

    # Let certbot answer the HTTP-01 challenge before any redirect applies.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        proxy_pass http://smartdeploy_frontend;
        proxy_http_version 1.1;

        # Websocket support for /api/v1/live/ws. Harmless for plain requests:
        # the map sends "close" when there is no Upgrade header.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $smartdeploy_connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        # Long enough for the live websocket to stay open.
        proxy_read_timeout    1h;

        proxy_buffering off;
    }

    # Edge security headers. Content-Security-Policy is intentionally omitted:
    # set it only after checking what the built SPA actually loads.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/test.smartsportz.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/test.smartsportz.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# ---------------------------------------------------------------------------
# Operator dashboards.
#
# Grafana and Prometheus are bound to 127.0.0.1 by docker-compose.yml, so they
# are NOT reachable from outside unless you enable this block. Prometheus has
# no authentication of its own - the allow/deny list below is the only thing
# protecting it. Keep it, or drop the block entirely and reach these over an
# SSH tunnel instead:
#
#   ssh -L 3001:127.0.0.1:3001 -L 9090:127.0.0.1:9090 user@server
# ---------------------------------------------------------------------------
#
# server {
#     listen 80;
#     server_name ops.test.smartsportz.in;
#
#     allow 203.0.113.0/24;   # CHANGE ME: your office / VPN range
#     deny  all;
#
#     location /grafana/ {
#         proxy_pass http://127.0.0.1:3001/;
#         proxy_http_version 1.1;
#         proxy_set_header Upgrade    $http_upgrade;
#         proxy_set_header Connection $smartdeploy_connection_upgrade;
#         proxy_set_header Host              $host;
#         proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#     }
#
#     location /prometheus/ {
#         proxy_pass http://127.0.0.1:9090/;
#         proxy_set_header Host              $host;
#         proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#     }
# }


server {
    if ($host = test.smartsportz.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name test.smartsportz.in;
    return 404; # managed by Certbot


}
